<!doctype html><meta charset="utf-8"><title>relay</title>
<script>
// Yönetici panellerine (YouTube Studio, Instagram) medya aktarır: ?t=<hedef köken>&f=a.mp4,b.jpg → üst pencereye Blob olarak gönderir.
(async () => {
  const q = new URLSearchParams(location.search);
  const ok = ['https://studio.youtube.com', 'https://www.instagram.com'];
  const target = q.get('t');
  if (!ok.includes(target)) return;
  for (const name of (q.get('f') || '').split(',').filter(Boolean)) {
    try {
      const blob = await (await fetch(name, { cache: 'no-store' })).blob();
      parent.postMessage({ name, blob }, target);
    } catch (e) { parent.postMessage({ name, error: String(e) }, target); }
  }
})();
</script>
